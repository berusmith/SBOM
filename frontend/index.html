<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover allows the page to extend into iPhone safe-area
         insets (notch, Dynamic Island, Home Indicator).  Safe-area padding
         on body in index.css keeps content out of those zones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- UX-3.027 — Matches the dark top nav (Tailwind slate-900 = #0f172a).
         Android Chrome uses this to tint the URL bar when our site is loaded.
         slate-900 has a slight cool / blue tint vs the previous gray-900;
         pairs with the in-app navbar's slate sweep for visual consistency. -->
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>SBOM Management Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
